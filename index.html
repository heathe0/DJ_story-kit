<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스토리 기사 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 고정 상단 막대 + 좌측 편집 열(블록 카드 스택) | 우측 실제 기사 미리보기 */
:root{
  --bg:#e9ecf0; --panel:#ffffff; --panel-2:#f4f6f8; --ink:#1a1f28; --muted:#5d6676; --line:#d6dbe2;
  --accent:#2a52b5; --accent-soft:#e3e9f8; --accent-ink:#ffffff; --danger:#b42318; --ok:#1d7a4c; --warn:#9a6200;
  --f-ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111419; --panel:#1a1e25; --panel-2:#21262e; --ink:#e5e8ed; --muted:#9aa3b3; --line:#30363f;
    --accent:#86a6ff; --accent-soft:#232c45; --accent-ink:#0c1220; --danger:#ff8f86; --ok:#6fd3a0; --warn:#f2c066; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.save-state{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.save-state.is-warn{color:var(--warn)}
.tb{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
  border-radius:var(--r);padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{filter:brightness(1.07);border-color:var(--accent)}
.btn--ghost{border-color:transparent;background:transparent}
.btn--ghost:hover{background:var(--panel-2);border-color:transparent}
.btn--sm{padding:3px 8px;font-size:12px}
.btn--danger{color:var(--danger)}
.btn svg{width:15px;height:15px;flex:none}

/* ---------- workspace ---------- */
.ws{display:grid;grid-template-columns:minmax(380px,460px) 1fr;flex:1;min-height:0}
.pane-ed{overflow:auto;border-right:1px solid var(--line);padding:16px 16px 120px}
.pane-pv{display:flex;flex-direction:column;min-width:0;background:var(--panel-2)}
.pv-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.pv-bar .lbl{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pv-stage{flex:1;overflow:auto;display:flex;justify-content:center;padding:0}
.pv-stage.is-mobile{padding:18px 0}
#pv{border:0;width:100%;height:100%;background:#fff;display:block}
.pv-stage.is-mobile #pv{width:390px;max-width:100%;height:calc(100% - 4px);border-radius:18px;box-shadow:0 0 0 8px #0d0f13,0 10px 40px rgba(0,0,0,.25)}
.mob-tabs{display:none}

/* ---------- cards ---------- */
.sec-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card + .card{margin-top:0}
.card.is-picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card__head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;min-height:42px}
.card__toggle{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:2px}
.chev{width:14px;height:14px;flex:none;transition:transform .15s;color:var(--muted)}
.card.is-open .chev{transform:rotate(90deg)}
.tag{flex:none;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.tag[data-g="데이터"],.tag[data-g="Data"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag[data-g="인터랙티브"],.tag[data-g="Interactive"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
.tools{display:flex;gap:2px;flex:none}
.ico{border:0;background:transparent;border-radius:4px;width:28px;height:28px;display:grid;place-items:center;color:var(--muted)}
.ico:hover{background:var(--panel-2);color:var(--ink)}
.ico.del:hover{color:var(--danger)}
.ico svg{width:15px;height:15px}
.card__body{display:none;padding:4px 12px 14px;border-top:1px solid var(--line)}
.card.is-open .card__body{display:grid;gap:12px;padding-top:12px}

/* ---------- fields ---------- */
.f{display:grid;gap:5px;min-width:0}
.f > label, .f > .lab{font-size:12.5px;font-weight:600}
.f .hint{font-size:12px;color:var(--muted);line-height:1.5}
.f .hint a{color:var(--accent)}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:7px 9px;font-size:13.5px;min-width:0}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.status{font-size:12px;font-family:var(--f-mono);padding:5px 8px;border-radius:4px;background:var(--panel-2);overflow-wrap:anywhere}
.status.ok{color:var(--ok)} .status.bad{color:var(--danger)}
.mdbar{display:flex;gap:4px;flex-wrap:wrap}
.mdbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:1px 8px;font-size:12px}
.mdbar button:hover{border-color:var(--muted)}
.mdbar .mk{background:linear-gradient(transparent 55%,#ffe36e 55%)}
.color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.color-row input[type=color]{width:42px;height:32px;padding:0;border:1px solid var(--line);border-radius:5px;background:none}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

.img-f{display:grid;gap:8px}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;min-width:0;accent-color:var(--accent)}
.rng-val{font-family:var(--f-mono);font-size:12px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.font-up{border:1.5px dashed var(--line);border-radius:6px;padding:10px;display:grid;gap:8px;background:var(--panel-2)}
.font-sample{font-size:20px;line-height:1.4;overflow-wrap:anywhere}
.font-up .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.font-up .acts{display:flex;gap:6px;flex-wrap:wrap}
.img-drop{border:1.5px dashed var(--line);border-radius:6px;padding:10px;display:flex;gap:10px;align-items:center;background:var(--panel-2)}
.img-drop.is-over{border-color:var(--accent);background:var(--accent-soft)}
.img-drop .thumb{width:84px;height:60px;border-radius:4px;object-fit:cover;background:var(--line);flex:none}
.img-drop .ph{width:84px;height:60px;border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);flex:none;text-align:center}
.img-drop .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.img-drop .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:100%}

.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:10px;background:var(--panel-2)}
.item__head{display:flex;align-items:center;gap:6px}
.item__head b{font-size:12px;font-family:var(--f-mono);color:var(--muted);margin-right:auto}

.adder{display:flex;justify-content:center;position:relative;height:22px;margin:2px 0}
.adder::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed transparent}
.adder:hover::before{border-top-color:var(--line)}
.adder button{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:999px;width:22px;height:22px;display:grid;place-items:center;color:var(--muted);opacity:.0;transition:opacity .12s}
.adder:hover button,.adder button:focus-visible,.adder.is-last button{opacity:1}
.adder.is-last{height:auto;margin-top:10px}
.adder.is-last button{width:100%;height:auto;border-radius:var(--r);padding:10px;border-style:dashed;font-weight:600;color:var(--accent);gap:6px;display:flex;justify-content:center}

.palette{position:fixed;z-index:50;width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:10px;display:grid;gap:10px;max-height:70vh;overflow:auto}
.palette h4{margin:0 0 4px;font-size:11px;font-family:var(--f-mono);color:var(--muted);letter-spacing:.08em}
.palette .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.palette button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;display:grid;gap:1px}
.palette button:hover{border-color:var(--accent);background:var(--accent-soft)}
.palette button b{font-size:13px}
.palette button span{font-size:11.5px;color:var(--muted);line-height:1.35}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.5);display:grid;place-items:center;padding:16px}
.modal__box{background:var(--panel);border-radius:10px;width:min(640px,100%);max-height:88vh;overflow:auto;padding:22px 24px;display:grid;gap:14px}
.modal__box h2{margin:0;font-size:19px}
.modal__box h3{margin:6px 0 0;font-size:14px}
.modal__box p,.modal__box li{color:var(--ink);line-height:1.65;font-size:13.5px}
.modal__box ol,.modal__box ul{margin:0;padding-left:20px;display:grid;gap:4px}
.modal__box code{font-family:var(--f-mono);font-size:12px;background:var(--panel-2);padding:1px 5px;border-radius:3px}
.modal__box .acts{display:flex;gap:8px;flex-wrap:wrap}
.modal__box .note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:6px;font-size:13px;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.25)}

@media (max-width: 960px){
  html,body{height:auto}
  .ws{grid-template-columns:1fr;flex:none}
  .mob-tabs{display:inline-flex}
  .ws[data-view="edit"] .pane-pv{display:none}
  .ws[data-view="preview"] .pane-ed{display:none}
  .pane-ed{border-right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pane-pv{height:calc(100vh - 110px)}
  .brand small{display:none}
}
@media (max-width:520px){ .row3{grid-template-columns:1fr 1fr} .tb .btn span{display:none} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
#bLang span{opacity:.5}#bLang span.on{opacity:1;font-weight:800}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>스토리 기사 편집기</b><small id="brandSub"></small></div>
  <span class="save-state" id="saveState">불러오는 중…</span>
  <div class="seg mob-tabs" role="group" aria-label="화면 전환">
    <button id="tabEdit" aria-pressed="true">편집</button><button id="tabPv" aria-pressed="false">미리보기</button>
  </div>
  <div class="tb">
    <button class="btn" id="bNew" title="빈 기사로 새로 시작"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>새 기사</span></button>
    <button class="btn" id="bSample" title="예시 기사 불러오기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>예시 불러오기</span></button>
    <button class="btn" id="bOpen" title="작업 파일(.json) 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg><span>작업 파일 열기</span></button>
    <button class="btn" id="bSave" title="작업 파일(.json)로 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><span>작업 파일 저장</span></button>
    <button class="btn btn--primary" id="bPublish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/></svg><span>발행하기</span></button>
    <button class="btn btn--ghost" id="bLang" title="Language · 언어" aria-label="Language · 언어"><span data-l="en">EN</span> | <span data-l="ko">한국어</span></button>
    <button class="btn btn--ghost" id="bHelp" title="도움말">도움말</button>
  </div>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
</header>

<div class="ws" id="ws" data-view="edit">
  <section class="pane-ed" id="editor" aria-label="편집"></section>
  <section class="pane-pv" aria-label="미리보기">
    <div class="pv-bar">
      <span class="lbl">미리보기</span>
      <div class="seg" role="group" aria-label="미리보기 크기">
        <button id="pvDesk" aria-pressed="true">PC</button><button id="pvMob" aria-pressed="false">휴대폰</button>
      </div>
      <label class="chk" style="font-size:12px"><input type="checkbox" id="pvAuto" checked> 자동 새로고침</label>
      <button class="btn btn--sm" id="pvRefresh">새로고침</button>
    </div>
    <div class="pv-stage" id="pvStage"><iframe id="pv" title="기사 미리보기"></iframe></div>
  </section>
</div>

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

   1. 주소(임베드) 해석기 — 유튜브, Flourish, 구글 시트, 구글 어스, 기타

/*PARSERS-START*/
function srcFromCode(u) { const m = String(u).match(/src\s*=\s*["']([^"']+)["']/i); return m ? m[1].replace(/&amp;/g, '&') : null; }
function safeUrl(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }

function parseYouTube(u) {
  u = String(u || '').trim(); if (!u) return null;
  u = srcFromCode(u) || u;
  let id = null;
  const m = u.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (m) id = m[1]; else if (/^[A-Za-z0-9_-]{11}$/.test(u)) id = u;
  if (!id) return { ok: false, msg: $t('유튜브 주소를 인식하지 못했어요. 영상 아래 [공유] 버튼에서 복사한 주소를 붙여넣으세요.') };
  const short = /shorts\//.test(u);
  let start = 0;
  const t = u.match(/[?&#](?:t|start)=([0-9hms]+)/);
  if (t) {
    const v = t[1];
    if (/^\d+$/.test(v)) start = +v;
    else { const g = r => +((v.match(r) || [0, 0])[1]); start = g(/(\d+)h/) * 3600 + g(/(\d+)m/) * 60 + g(/(\d+)s/); }
  }
  const embed = `https://www.youtube.com/embed/${id}${start ? `?start=${start}` : ''}`;
  return { ok: true, id, start, short, embed, msg: `${$t("인식됨 · 영상 ")}${id}${start ? $tf(' · 재생 시작 {0}초', start) : ''}${short ? $t(' · 쇼츠(세로 화면)') : ''}` };
}

function parseFlourish(u) {
  u = String(u || '').trim(); if (!u) return null;
  let m = u.match(/(visualisation|story)\/(\d+)/);
  if (!m && /^\d+$/.test(u)) m = [0, 'visualisation', u];
  if (!m) return { ok: false, msg: $t('Flourish 주소를 인식하지 못했어요. [Export & publish]로 게시한 뒤 나오는 링크나 임베드 코드를 붙여넣으세요.') };
  const kind = m[1], id = m[2];
  const warn = /app\.flourish\.studio/.test(u) ? $t(' · 편집 화면 주소예요. 게시(Publish)를 했는지 확인하세요') : '';
  return { ok: true, kind, id, embed: `https://flo.uri.sh/${kind}/${id}/embed`, msg: `${$t("인식됨 · ")}${kind === 'story' ? $t('스토리') : $t('시각화')} #${id}${warn}` };

let state = null;
const DB = {
  db: null,
  open() { return new Promise((res, rej) => { try { const r = indexedDB.open('story-kit', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async get(k) { if (!this.db) await this.open(); return new Promise((res, rej) => { const t = this.db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  async set(k, v) { if (!this.db) await this.open(); return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const el = $('#saveState');
    try {
      await DB.set('current', JSON.stringify(state));
      const d = new Date(); el.textContent = `${$t("자동 저장됨 ")}${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; el.classList.remove('is-warn');
    } catch (e) { el.textContent = $t('자동 저장 실패 · 작업 파일로 저장하세요'); el.classList.add('is-warn'); }
  }, 700);
}
function normalize(s) {
  const base = blankState();
  if (!s || typeof s !== 'object') return base;
  const old = s.meta || {};
  s.meta = Object.assign(base.meta, old);
  if (!old.lang) s.meta.lang = 'ko';
  if (!old.bg && old.theme === 'dark') s.meta.bg = '#121418';
  if (!FONTS[s.meta.headFont]) s.meta.headFont = 'nanum_gothic';
  if (!FONTS[s.meta.bodyFont]) s.meta.bodyFont = 'nanum_gothic';
  s.blocks = (Array.isArray(s.blocks) ? s.blocks : []).filter(b => b && TYPES[b.type]).map(b => Object.assign(newBlock(b.type), b, { id: b.id || uid() }));
  return s;
}

function cardShell(id, tagText, group, summaryFn, tools) {
  const card = h('article', { class: 'card' + (openCards.has(id) ? ' is-open' : '') + (pickedId === id ? ' is-picked' : ''), 'data-id': id });
  const sum = h('span', { class: 'sum' }, summaryFn());
  const toggle = h('button', { class: 'card__toggle', 'aria-expanded': openCards.has(id) ? 'true' : 'false' });
  toggle.innerHTML = ICON.chev; toggle.append(h('span', { class: 'tag', 'data-g': group }, tagText), sum);
  toggle.addEventListener('click', () => {
    const open = !card.classList.contains('is-open');
    card.classList.toggle('is-open', open); toggle.setAttribute('aria-expanded', open);
    open ? openCards.add(id) : openCards.delete(id);
    if (open) gotoPreview(id);
  });
  const head = h('header', { class: 'card__head' }, toggle);
  if (tools) head.append(tools);
  const body = h('div', { class: 'card__body' });
  card.append(head, body);
  card._sum = () => { sum.textContent = summaryFn(); };
  card.addEventListener('focusin', () => gotoPreview(id));
  return { card, body };
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.9;word-break:keep-all;overflow-wrap:break-word}
img{max-width:100%;display:block}
a{color:inherit;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 1px}
.progress{position:fixed;inset:0 0 auto;height:3px;z-index:30;pointer-events:none}
.progress span{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
.topbar{position:absolute;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px var(--gut);font:700 13px/1 var(--f-body);letter-spacing:.01em;color:var(--ink)}
.topbar.on-dark{color:#fff}
.topbar button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:999px;padding:6px 12px;cursor:pointer;opacity:.85}
.topbar button:hover{opacity:1}
/* hero */
.hero{position:relative}
.hero__kicker{font:700 14px/1.4 var(--f-body);letter-spacing:.01em;color:var(--accent);margin:0 0 18px}
.hero__title{font-family:var(--f-head);font-weight:800;font-size:calc(clamp(34px,6.2vw,72px) * var(--hs));line-height:1.18;letter-spacing:-.02em;margin:0;text-wrap:balance}
.hero__sub{font-size:calc(var(--fs) * 1.15);line-height:1.7;margin:22px 0 0;max-width:640px;color:var(--ink-2);text-wrap:pretty}

.hero--overlay{min-height:min(94vh,980px);display:flex;align-items:flex-end;color:#fff;background:#14161b}
.hero--overlay .hero__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero--overlay::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.82) 100%)}

.hero--text .hero__in{max-width:var(--wide);margin:0 auto;padding:130px var(--gut) 40px}

.byline{max-width:var(--col);margin:44px auto 0;padding:0 var(--gut);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;font-size:14px;color:var(--muted);line-height:1.6;border-bottom:1px solid var(--rule);padding-bottom:22px;box-sizing:content-box}

/* body */

.earth-link{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font:500 13px/1 var(--f-mono);padding:9px 14px;border:1px solid var(--rule);border-radius:999px;text-decoration:none;background:var(--card)}
.earth-card{display:flex;flex-direction:column;gap:8px;padding:22px 24px;border:1px solid var(--rule);border-radius:14px;text-decoration:none;background:var(--accent-soft)}

.earth-card__k{font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

.earth-link:hover{border-color:var(--accent);color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px 32px;padding:34px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.stat__num{font-family:var(--f-head);font-weight:800;font-size:calc(clamp(40px,5.4vw,60px) * var(--hs));line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat__num small{font-size:.42em;font-weight:700;margin-left:3px;color:var(--ink);letter-spacing:0}
.stat__label{margin-top:8px;font-size:calc(var(--fs) * .84);line-height:1.55;color:var(--ink-2)}
.stats__note{margin:10px 0 0;font:12px/1.5 var(--f-mono);color:var(--muted)}
/* table */
.tbl-wrap{overflow:auto;max-height:560px;border-top:2px solid var(--ink)}

.dt th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:700;font-size:13px;color:var(--ink-2);padding:12px 12px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
.dt td{padding:10px 12px;border-bottom:1px solid var(--rule)}
.dt .num{text-align:right}
.dt tbody tr:hover td{background:var(--soft)}
/* scrolly */
.blk--scrolly{max-width:none;padding:0;margin-top:72px!important;margin-bottom:72px}
.scrolly{position:relative}
.scrolly__fig{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--fig)}
.scrolly__layer{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
.scrolly__layer.is-active{opacity:1}
.scrolly__layer img{width:100%;height:100%;object-fit:var(--fit,cover)}
.scrolly__fig iframe{width:100%;height:100%;border:0;display:block}
.scrolly__credit{position:absolute;right:12px;bottom:10px;font:11px/1 var(--f-mono);color:var(--muted);z-index:2}
.scrolly__steps{position:relative;z-index:2;margin-top:-100vh;margin-top:-100svh;pointer-events:none}
.step{min-height:100vh;display:flex;align-items:center;padding:0 var(--gut)}
.step:first-child{min-height:70vh;align-items:flex-end;padding-bottom:20vh}
.step:last-child{min-height:110vh}
.al-left .step{justify-content:flex-start}.al-center .step{justify-content:center}.al-right .step{justify-content:flex-end}
.step__card{pointer-events:auto;max-width:420px;width:100%;background:var(--card);color:var(--ink);padding:20px 24px;border-radius:3px;box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:calc(var(--fs) * .95);line-height:1.8;opacity:.55;transition:opacity .3s}
.step.is-active .step__card{opacity:1}
.step__card p{margin:0 0 .8em}.step__card p:last-child{margin:0}
@media (min-width:1100px){.al-left .step{padding-left:max(6vw,var(--gut))}.al-right .step{padding-right:max(6vw,var(--gut))}}
/* footer */
.credits{max-width:var(--col);margin:72px auto 0;padding:36px var(--gut) 80px;border-top:2px solid var(--ink);font-size:14px;line-height:1.75;color:var(--ink-2);box-sizing:content-box}
.credits h2{font:700 13px/1 var(--f-body);color:var(--muted);margin:0 0 14px}
.credits dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;margin:0 0 28px}
.credits dt{color:var(--muted)}.credits dd{margin:0;color:var(--ink)}
.credits ul{margin:0 0 28px;padding-left:1.1em}
.credits li{overflow-wrap:anywhere}
.credits .endnote{margin:0 0 28px;color:var(--ink)}
.credits .outlet{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* preview only */
.ph{display:grid;place-items:center;text-align:center;min-height:220px;padding:24px;border:2px dashed var(--rule);border-radius:6px;color:var(--muted);font:500 14px/1.6 var(--f-mono);background:var(--soft)}
.ph b{display:block;color:var(--ink);font-family:var(--f-body);font-size:16px;margin-bottom:4px}
.scrolly__layer .ph{position:absolute;inset:24px;min-height:0}
@media (max-width:760px){
  body{font-size:calc(var(--fs) - 1px);line-height:1.85}
  .frame iframe{height:var(--mh,var(--h,480px))}
  .hero--split{grid-template-columns:1fr}
  .hero--split .hero__media{min-height:56vh;order:-1}
  .hero--split .hero__in{padding:36px var(--gut) 24px}
  body:has(.hero--split .hero__img) .topbar{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .gal-3{grid-template-columns:1fr 1fr}
  .step__card{max-width:none}
  .byline time{margin-left:0;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
`;
}

function capHTML(b) {
  const parts = [];
  if (b.caption) parts.push(`<span class="cap">${mdInline(b.caption)}</span>`);
  if (b.source) parts.push(`${$t("<span class=\"src\">출처: ")}${mdInline(b.source)}</span>`);
  if (b.credit) parts.push(`<span class="credit">${esc(b.credit)}</span>`);
  return parts.length ? `<figcaption>${parts.join('')}</figcaption>` : '';
}
const ph = (title, line) => `<div class="ph"><div><b>${esc(title)}</b>${esc(line)}</div></div>`;
function iframeTag(src, title, extra = '') {
  return `<iframe src="${esc(src)}" title="${esc(title)}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" ${extra}></iframe>`;
}

function renderBlock(b, P) {
  const W = b.width || 'col';
  const wrap = (inner, w = W) => `<div class="blk blk--${b.type} w-${w}" id="b-${esc(b.id)}">${inner}</div>`;
  switch (b.type) {
    case 'heading':
      if (!b.text && !P) return '';
      return wrap(`<h2 class="sec">${b.eyebrow ? `<span class="eyebrow">${esc(b.eyebrow)}</span>` : ''}${esc(b.text || $t('소제목'))}</h2>`, 'col');
    case 'text':
      if (!String(b.text || '').trim()) return P ? wrap(ph($t('본문'), $t('왼쪽에서 글을 입력하세요')), 'col') : '';
      return wrap(`<div class="prose">${md(b.text)}</div>`, 'col');
    case 'quote':
      if (!b.text) return P ? wrap(ph($t('인용'), $t('인용문을 입력하세요')), 'col') : '';
      return wrap(`<blockquote class="pull"><p>${mdInline(b.text)}</p>${b.source ? `<cite>${esc(b.source)}</cite>` : ''}</blockquote>`, 'col');
    case 'callout':
      if (!b.text && !b.title) return '';
      return wrap(b.collapsed
        ? `<details class="box"><summary>${esc(b.title || $t('더 보기'))}</summary><div class="prose">${md(b.text)}</div></details>`
        : `<aside class="box">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<div class="prose">${md(b.text)}</div></aside>`, 'col');
    case 'divider': return `<hr class="div div--${esc(b.style || 'line')}" id="b-${esc(b.id)}">`;
    case 'image': {
      const src = b.src && (b.src.startsWith('data:image/') || safeUrl(b.src));
      if (!src) return P ? wrap(`<figure>${ph($t('사진'), $t('사진을 올리면 여기에 보여요'))}${capHTML(b)}</figure>`) : '';
      return wrap(`<figure><img src="${esc(b.src)}" alt="${esc(b.alt)}" loading="lazy">${capHTML(b)}</figure>`);
    }
    case 'gallery': {
      const items = (b.items || []).filter(x => x.src);
      if (!items.length) return P ? wrap(`<figure>${ph($t('사진 묶음'), $t('사진을 2~4장 올리세요'))}${capHTML(b)}</figure>`) : '';
      return wrap(`<figure><div class="gal gal-${Math.min(items.length, 4)}">${items.map(x => `<img src="${esc(x.src)}" alt="${esc(x.alt)}" loading="lazy">`).join('')}</div>${capHTML(b)}</figure>`);
    }
    case 'youtube': {
      const p = parseYouTube(b.url);
      if (!p || !p.ok) return P ? wrap(`<figure>${ph($t('유튜브'), p ? $t('주소를 인식하지 못했어요') : $t('유튜브 주소를 넣으면 여기에 영상이 나와요'))}${capHTML(b)}</figure>`) : '';
      return wrap(`<figure><div class="frame frame--video${p.short ? ' is-short' : ''}">${iframeTag(p.embed, b.caption || $t('YouTube 동영상'), 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen')}</div>${capHTML(b)}</figure>`);
    }
    case 'stats': {
      const items = (b.items || []).filter(x => x.value || x.label);
      if (!items.length) return P ? wrap(ph($t('숫자 강조'), $t('숫자를 입력하세요')), 'col') : '';
      return wrap(`<div class="stats">${items.map(x => {
        const v = String(x.value || '').trim(); const countable = /^[\d,]+(\.\d+)?$/.test(v);
        return `<div class="stat"><div class="stat__num"><span${countable ? ` data-count="${esc(v)}"` : ''}>${esc(v)}</span>${x.unit ? `<small>${esc(x.unit)}</small>` : ''}</div>${x.label ? `<div class="stat__label">${esc(x.label)}</div>` : ''}</div>`;
      }).join('')}</div>${b.note ? `<p class="stats__note">${esc(b.note)}</p>` : ''}`, 'col');
    }
    case 'flourish': {
      const p = parseFlourish(b.url);
      if (!p || !p.ok) return P ? wrap(`<figure>${b.title ? `<p class="fig-title">${esc(b.title)}</p>` : ''}${ph($t('Flourish 시각화'), p ? $t('주소를 인식하지 못했어요') : $t('Flourish에서 게시한 주소를 넣으면 여기에 차트가 나와요'))}${capHTML(b)}</figure>`) : '';
      return wrap(`<figure>${b.title ? `<p class="fig-title">${esc(b.title)}</p>` : ''}<div class="frame" style="--h:${+b.height || 600}px;--mh:${+b.mheight || +b.height || 520}px">${iframeTag(p.embed, b.title || $t('Flourish 시각화'), 'scrolling="no" sandbox="allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"')}</div>${capHTML(b)}</figure>`);
    }
    case 'sheet': {
      const title = b.title ? `<p class="fig-title">${esc(b.title)}</p>` : '';
      if (b.mode === 'embed') {
        const p = parseSheet(b.url);
        if (!p || !p.ok) return P ? wrap(`<figure>${title}${ph($t('구글 시트'), $t('시트 주소를 넣으세요'))}${capHTML(b)}</figure>`) : '';
        return wrap(`<figure>${title}<div class="frame" style="--h:${+b.height || 480}px">${iframeTag(p.embed, b.title || $t('구글 시트 표'))}</div>${capHTML(b)}</figure>`);
      }
      const rows = parseTable(b.data).filter(r => r.some(c => String(c).trim()));
      if (rows.length < 1) return P ? wrap(`<figure>${title}${ph($t('구글 시트 표'), $t('[시트에서 데이터 가져오기]를 누르거나 표를 붙여넣으세요'))}${capHTML(b)}</figure>`) : '';
      const [head, ...body] = rows; const n = Math.max(...rows.map(r => r.length));
      const numCol = [...Array(n)].map((_, j) => body.length && body.every(r => !String(r[j] ?? '').trim() || isNumCell(r[j])));
      const cell = (c, j, tag) => `<${tag}${numCol[j] ? ' class="num"' : ''}>${esc(String(c ?? '').trim())}</${tag}>`;
      return wrap(`<figure>${title}<div class="tbl-wrap"><table class="dt"><thead><tr>${[...Array(n)].map((_, j) => cell(head[j], j, 'th')).join('')}</tr></thead><tbody>${body.map(r => `<tr>${[...Array(n)].map((_, j) => cell(r[j], j, 'td')).join('')}</tr>`).join('')}</tbody></table></div>${capHTML(b)}</figure>`);
    }
    case 'earth': {
      const proj = /^https:\/\/earth\.google\.com\//.test(b.projectUrl || '') ? safeUrl(b.projectUrl) : '';
      if (proj) return wrap(`<figure><a class="earth-card" href="${esc(proj)}${$t("\" target=\"_blank\" rel=\"noopener\"><span class=\"earth-card__k\">Google Earth</span>")}<b>${esc(b.title || $t('구글 어스 프로젝트'))}</b><span class="earth-card__go">${$t('구글 어스에서 슬라이드 보기')} ↗</span></a>${capHTML(b)}</figure>`);
      const src = mapEmbed(b);
      if (!src) return P ? wrap(`<figure>${ph($t('구글 어스 · 지도'), $t('구글 어스 링크나 좌표를 넣으세요'))}${capHTML(b)}</figure>`) : '';
      const lat = parseFloat(b.lat), lng = parseFloat(b.lng);

/* 발행된 기사 안에서 도는 코드 (진행 막대, 스크롤리텔링, 숫자 카운트업, 링크 복사) */
function articleRuntime() {

    if (!hasIO) return;

      es.forEach(function (e) {

    h('p', { class: 'note' }, $t('유튜브·Flourish·지도는 웹에 올린 기사에서 가장 정확하게 보입니다. 작업 파일(.json)도 꼭 함께 보관하세요. 나중에 고칠 때는 작업 파일을 열어 수정한 뒤 다시 발행하면 됩니다.'))
  ]);
};

  h('h3', {}, $t('본문 서식')),

    h('li', {}, $t('빈 줄 = 새 문단. 줄 앞에 '), h('code', {}, '- '), $t('을 쓰면 목록'))),

/* =====================================================================
   8. 시작
   ===================================================================== */
function trDom() {
  document.documentElement.lang = UI;
  document.title = $t('스토리 기사 편집기');
  const sub = $('#brandSub'); if (sub) sub.textContent = 'Story Kit v' + VERSION + ' · ' + $t('데이터 스토리텔링 실습');
  document.querySelectorAll('#bLang [data-l]').forEach(e => e.classList.toggle('on', e.dataset.l === UI));
  if (UI !== 'en') return;
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { const t = n.nodeValue.trim(); if (/[가-힣]/.test(t) && EN[t]) n.nodeValue = n.nodeValue.replace(t, EN[t]); });
  document.querySelectorAll('[title],[aria-label]').forEach(e => ['title', 'aria-label'].forEach(a => { const v = e.getAttribute(a); if (v && /[가-힣]/.test(v) && EN[v]) e.setAttribute(a, EN[v]); }));
}
$('#bLang').onclick = async () => {
  const next = UI === 'en' ? 'ko' : 'en';
  try { await DB.set('current', JSON.stringify(state)); } catch (e) { }
  try { localStorage.setItem('storykit-lang', next); } catch (e) { }
  location.reload();
};
(async function boot() {
  trDom();
  let saved = null;
  try { saved = await DB.get('current'); } catch (e) { }
  try { state = saved ? normalize(JSON.parse(saved)) : sampleState(); } catch (e) { saved = null; state = sampleState(); }
  $('#saveState').textContent = saved ? $t('이전 작업을 불러왔어요') : $t('예시 기사로 시작');
  renderEditor(); refreshPreview();
})();
</script>
