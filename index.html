<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스토리 기사 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 고정 상단 막대 + 좌측 편집 열(블록 카드 스택) | 우측 실제 기사 미리보기 */
:root{
  --bg:#e9ecf0; --panel:#ffffff; --panel-2:#f4f6f8; --ink:#1a1f28; --muted:#5d6676; --line:#d6dbe2;
  --accent:#2a52b5; --accent-soft:#e3e9f8; --accent-ink:#ffffff; --danger:#b42318; --ok:#1d7a4c; --warn:#9a6200;
  --f-ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111419; --panel:#1a1e25; --panel-2:#21262e; --ink:#e5e8ed; --muted:#9aa3b3; --line:#30363f;
    --accent:#86a6ff; --accent-soft:#232c45; --accent-ink:#0c1220; --danger:#ff8f86; --ok:#6fd3a0; --warn:#f2c066; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.save-state{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.save-state.is-warn{color:var(--warn)}
.tb{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
  border-radius:var(--r);padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{filter:brightness(1.07);border-color:var(--accent)}
.btn--ghost{border-color:transparent;background:transparent}
.btn--ghost:hover{background:var(--panel-2);border-color:transparent}
.btn--sm{padding:3px 8px;font-size:12px}
.btn--danger{color:var(--danger)}
.btn svg{width:15px;height:15px;flex:none}

/* ---------- workspace ---------- */
.ws{display:grid;grid-template-columns:minmax(380px,460px) 1fr;flex:1;min-height:0}
.pane-ed{overflow:auto;border-right:1px solid var(--line);padding:16px 16px 120px}
.pane-pv{display:flex;flex-direction:column;min-width:0;background:var(--panel-2)}
.pv-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.pv-bar .lbl{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pv-stage{flex:1;overflow:auto;display:flex;justify-content:center;padding:0}
.pv-stage.is-mobile{padding:18px 0}
#pv{border:0;width:100%;height:100%;background:#fff;display:block}
.pv-stage.is-mobile #pv{width:390px;max-width:100%;height:calc(100% - 4px);border-radius:18px;box-shadow:0 0 0 8px #0d0f13,0 10px 40px rgba(0,0,0,.25)}
.mob-tabs{display:none}

/* ---------- cards ---------- */
.sec-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card + .card{margin-top:0}
.card.is-picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card__head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;min-height:42px}
.card__toggle{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:2px}
.chev{width:14px;height:14px;flex:none;transition:transform .15s;color:var(--muted)}
.card.is-open .chev{transform:rotate(90deg)}
.tag{flex:none;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.tag[data-g="데이터"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag[data-g="인터랙티브"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
.tools{display:flex;gap:2px;flex:none}
.ico{border:0;background:transparent;border-radius:4px;width:28px;height:28px;display:grid;place-items:center;color:var(--muted)}
.ico:hover{background:var(--panel-2);color:var(--ink)}
.ico.del:hover{color:var(--danger)}
.ico svg{width:15px;height:15px}
.card__body{display:none;padding:4px 12px 14px;border-top:1px solid var(--line)}
.card.is-open .card__body{display:grid;gap:12px;padding-top:12px}

/* ---------- fields ---------- */
.f{display:grid;gap:5px;min-width:0}
.f > label, .f > .lab{font-size:12.5px;font-weight:600}
.f .hint{font-size:12px;color:var(--muted);line-height:1.5}
.f .hint a{color:var(--accent)}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:7px 9px;font-size:13.5px;min-width:0}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.status{font-size:12px;font-family:var(--f-mono);padding:5px 8px;border-radius:4px;background:var(--panel-2);overflow-wrap:anywhere}
.status.ok{color:var(--ok)} .status.bad{color:var(--danger)}
.mdbar{display:flex;gap:4px;flex-wrap:wrap}
.mdbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:1px 8px;font-size:12px}
.mdbar button:hover{border-color:var(--muted)}
.mdbar .mk{background:linear-gradient(transparent 55%,#ffe36e 55%)}
.color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.color-row input[type=color]{width:42px;height:32px;padding:0;border:1px solid var(--line);border-radius:5px;background:none}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

.img-f{display:grid;gap:8px}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;min-width:0;accent-color:var(--accent)}
.rng-val{font-family:var(--f-mono);font-size:12px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.font-up{border:1.5px dashed var(--line);border-radius:6px;padding:10px;display:grid;gap:8px;background:var(--panel-2)}
.font-sample{font-size:20px;line-height:1.4;overflow-wrap:anywhere}
.font-up .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.font-up .acts{display:flex;gap:6px;flex-wrap:wrap}
.img-drop{border:1.5px dashed var(--line);border-radius:6px;padding:10px;display:flex;gap:10px;align-items:center;background:var(--panel-2)}
.img-drop.is-over{border-color:var(--accent);background:var(--accent-soft)}
.img-drop .thumb{width:84px;height:60px;border-radius:4px;object-fit:cover;background:var(--line);flex:none}
.img-drop .ph{width:84px;height:60px;border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);flex:none;text-align:center}
.img-drop .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.img-drop .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:100%}

.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:10px;background:var(--panel-2)}
.item__head{display:flex;align-items:center;gap:6px}
.item__head b{font-size:12px;font-family:var(--f-mono);color:var(--muted);margin-right:auto}

.adder{display:flex;justify-content:center;position:relative;height:22px;margin:2px 0}
.adder::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed transparent}
.adder:hover::before{border-top-color:var(--line)}
.adder button{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:999px;width:22px;height:22px;display:grid;place-items:center;color:var(--muted);opacity:.0;transition:opacity .12s}
.adder:hover button,.adder button:focus-visible,.adder.is-last button{opacity:1}
.adder.is-last{height:auto;margin-top:10px}
.adder.is-last button{width:100%;height:auto;border-radius:var(--r);padding:10px;border-style:dashed;font-weight:600;color:var(--accent);gap:6px;display:flex;justify-content:center}

.palette{position:fixed;z-index:50;width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:10px;display:grid;gap:10px;max-height:70vh;overflow:auto}
.palette h4{margin:0 0 4px;font-size:11px;font-family:var(--f-mono);color:var(--muted);letter-spacing:.08em}
.palette .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.palette button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;display:grid;gap:1px}
.palette button:hover{border-color:var(--accent);background:var(--accent-soft)}
.palette button b{font-size:13px}
.palette button span{font-size:11.5px;color:var(--muted);line-height:1.35}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.5);display:grid;place-items:center;padding:16px}
.modal__box{background:var(--panel);border-radius:10px;width:min(640px,100%);max-height:88vh;overflow:auto;padding:22px 24px;display:grid;gap:14px}
.modal__box h2{margin:0;font-size:19px}
.modal__box h3{margin:6px 0 0;font-size:14px}
.modal__box p,.modal__box li{color:var(--ink);line-height:1.65;font-size:13.5px}
.modal__box ol,.modal__box ul{margin:0;padding-left:20px;display:grid;gap:4px}
.modal__box code{font-family:var(--f-mono);font-size:12px;background:var(--panel-2);padding:1px 5px;border-radius:3px}
.modal__box .acts{display:flex;gap:8px;flex-wrap:wrap}
.modal__box .note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:6px;font-size:13px;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.25)}

@media (max-width: 960px){
  html,body{height:auto}
  .ws{grid-template-columns:1fr;flex:none}
  .mob-tabs{display:inline-flex}
  .ws[data-view="edit"] .pane-pv{display:none}
  .ws[data-view="preview"] .pane-ed{display:none}
  .pane-ed{border-right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pane-pv{height:calc(100vh - 110px)}
  .brand small{display:none}
}
@media (max-width:520px){ .row3{grid-template-columns:1fr 1fr} .tb .btn span{display:none} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>스토리 기사 편집기</b><small>Story Kit v0.8 · 데이터 스토리텔링 실습</small></div>
  <span class="save-state" id="saveState">불러오는 중…</span>
  <div class="seg mob-tabs" role="group" aria-label="화면 전환">
    <button id="tabEdit" aria-pressed="true">편집</button><button id="tabPv" aria-pressed="false">미리보기</button>
  </div>
  <div class="tb">
    <button class="btn" id="bNew" title="빈 기사로 새로 시작"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>새 기사</span></button>
    <button class="btn" id="bSample" title="예시 기사 불러오기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>예시 불러오기</span></button>
    <button class="btn" id="bOpen" title="작업 파일(.json) 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg><span>작업 파일 열기</span></button>
    <button class="btn" id="bSave" title="작업 파일(.json)로 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><span>작업 파일 저장</span></button>
    <button class="btn btn--primary" id="bPublish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/></svg><span>발행하기</span></button>
    <button class="btn btn--ghost" id="bHelp" title="도움말">도움말</button>
  </div>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
</header>

<div class="ws" id="ws" data-view="edit">
  <section class="pane-ed" id="editor" aria-label="편집"></section>
  <section class="pane-pv" aria-label="미리보기">
    <div class="pv-bar">
      <span class="lbl">미리보기</span>
      <div class="seg" role="group" aria-label="미리보기 크기">
        <button id="pvDesk" aria-pressed="true">PC</button><button id="pvMob" aria-pressed="false">휴대폰</button>
      </div>
      <label class="chk" style="font-size:12px"><input type="checkbox" id="pvAuto" checked> 자동 새로고침</label>
      <button class="btn btn--sm" id="pvRefresh">새로고침</button>
    </div>
    <div class="pv-stage" id="pvStage"><iframe id="pv" title="기사 미리보기"></iframe></div>
  </section>
</div>

<script>
'use strict';
/* =====================================================================
   0. 작은 도구들
   ===================================================================== */
const VERSION = '0.8';
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const ICON = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  dup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>'
};
function toast(msg, ms = 2400) { const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), ms); }
function download(name, text, type) {
  const blob = new Blob([text], { type }); const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function slugify(s) { return (String(s || '').trim().replace(/[\\/:*?"<>|\s]+/g, '-').replace(/-+/g, '-').slice(0, 40) || 'story'); }
function fmtBytes(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.round(n / 1024) + 'KB'; }

/* =====================================================================
   1. 주소(임베드) 해석기 — 유튜브, Flourish, 구글 시트, 구글 어스, 기타
   ===================================================================== */
/*PARSERS-START*/
function srcFromCode(u) { const m = String(u).match(/src\s*=\s*["']([^"']+)["']/i); return m ? m[1].replace(/&amp;/g, '&') : null; }
function safeUrl(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }

function parseYouTube(u) {
  u = String(u || '').trim(); if (!u) return null;
  u = srcFromCode(u) || u;
  let id = null;
  const m = u.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (m) id = m[1]; else if (/^[A-Za-z0-9_-]{11}$/.test(u)) id = u;
  if (!id) return { ok: false, msg: '유튜브 주소를 인식하지 못했어요. 영상 아래 [공유] 버튼에서 복사한 주소를 붙여넣으세요.' };
  const short = /shorts\//.test(u);
  let start = 0;
  const t = u.match(/[?&#](?:t|start)=([0-9hms]+)/);
  if (t) {
    const v = t[1];
    if (/^\d+$/.test(v)) start = +v;
    else { const g = r => +((v.match(r) || [0, 0])[1]); start = g(/(\d+)h/) * 3600 + g(/(\d+)m/) * 60 + g(/(\d+)s/); }
  }
  const embed = `https://www.youtube.com/embed/${id}${start ? `?start=${start}` : ''}`;
  return { ok: true, id, start, short, embed, msg: `인식됨 · 영상 ${id}${start ? ` · ${start}초부터 재생` : ''}${short ? ' · 쇼츠(세로 화면)' : ''}` };
}

function parseFlourish(u) {
  u = String(u || '').trim(); if (!u) return null;
  let m = u.match(/(visualisation|story)\/(\d+)/);
  if (!m && /^\d+$/.test(u)) m = [0, 'visualisation', u];
  if (!m) return { ok: false, msg: 'Flourish 주소를 인식하지 못했어요. [Export & publish]로 게시한 뒤 나오는 링크나 임베드 코드를 붙여넣으세요.' };
  const kind = m[1], id = m[2];
  const warn = /app\.flourish\.studio/.test(u) ? ' · 편집 화면 주소예요. 게시(Publish)를 했는지 확인하세요' : '';

  async set(k, v) { if (!this.db) await this.open(); return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }

function normalize(s) {

function renderFields(container, fields, obj, block, card) {
  container.innerHTML = '';
  let rowBuf = null, rowKind = null;
  const flush = () => { if (rowBuf) { container.append(rowBuf); rowBuf = null; rowKind = null; } };
  for (const f of fields) {
    if (f.show && !f.show(block)) continue;
    const el = renderField(f, obj, block, card, container, fields);
    const kind = f.half ? 'row2' : f.third ? 'row3' : null;
    if (kind) {
      if (!rowBuf || rowKind !== kind || rowBuf.children.length >= (kind === 'row2' ? 2 : 3)) { flush(); rowBuf = h('div', { class: kind }); rowKind = kind; }
      rowBuf.append(el);
    } else { flush(); container.append(el); }
  }
  flush();
}
function fid() { return 'f' + uid(); }
function renderField(f, obj, block, card, container, fields) {

  const hint = f.hint ? h('div', { class: 'hint' }, f.hint) : null;
  const set = (v, rerender) => {
    obj[f.k] = v; card && card._sum && card._sum();
    if (rerender || f.rerender) renderFields(container, fields, obj, block, card);
    changed(false);
  };
  let input;
  switch (f.t) {
    case 'text': case 'date':
      input = h('input', { id, type: f.t, value: obj[f.k] ?? '', placeholder: f.ph || '' });
      input.addEventListener('input', () => set(input.value)); break;
    case 'number':
      input = h('input', { id, type: 'number', value: obj[f.k] ?? '', placeholder: f.ph || '', inputmode: 'numeric' });
      input.addEventListener('input', () => set(input.value === '' ? '' : +input.value)); break;

function contrastInk(hex) {
  const m = String(hex).replace('#', '').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i); if (!m) return '#fff';

  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.36 ? '#111318' : '#ffffff';
}
function lum(hex) {
  const m = String(hex).replace('#', '').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i); if (!m) return 1;
  const [r, g, b] = m.slice(1).map(x => { const c = parseInt(x, 16) / 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); });

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
`;

function capHTML(b) {
  const parts = [];
  if (b.caption) parts.push(`<span class="cap">${mdInline(b.caption)}</span>`);
  if (b.source) parts.push(`<span class="src">출처: ${mdInline(b.source)}</span>`);
  if (b.credit) parts.push(`<span class="credit">${esc(b.credit)}</span>`);
  return parts.length ? `<figcaption>${parts.join('')}</figcaption>` : '';
}
const ph = (title, line) => `<div class="ph"><div><b>${esc(title)}</b>${esc(line)}</div></div>`;
function iframeTag(src, title, extra = '') {
  return `<iframe src="${esc(src)}" title="${esc(title)}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" ${extra}></iframe>`;
}

function renderBlock(b, P) {
  const W = b.width || 'col';
  const wrap = (inner, w = W) => `<div class="blk blk--${b.type} w-${w}" id="b-${esc(b.id)}">${inner}</div>`;
  switch (b.type) {
    case 'heading':
      if (!b.text && !P) return '';
      return wrap(`<h2 class="sec">${b.eyebrow ? `<span class="eyebrow">${esc(b.eyebrow)}</span>` : ''}${esc(b.text || '소제목')}</h2>`, 'col');
    case 'text':
      if (!String(b.text || '').trim()) return P ? wrap(ph('본문', '왼쪽에서 글을 입력하세요'), 'col') : '';
      return wrap(`<div class="prose">${md(b.text)}</div>`, 'col');
    case 'quote':
      if (!b.text) return P ? wrap(ph('인용', '인용문을 입력하세요'), 'col') : '';
      return wrap(`<blockquote class="pull"><p>${mdInline(b.text)}</p>${b.source ? `<cite>${esc(b.source)}</cite>` : ''}</blockquote>`, 'col');
    case 'callout':
      if (!b.text && !b.title) return '';
      return wrap(b.collapsed
        ? `<details class="box"><summary>${esc(b.title || '더 보기')}</summary><div class="prose">${md(b.text)}</div></details>`
        : `<aside class="box">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<div class="prose">${md(b.text)}</div></aside>`, 'col');
    case 'divider': return `<hr class="div div--${esc(b.style || 'line')}" id="b-${esc(b.id)}">`;
    case 'image': {
      const src = b.src && (b.src.startsWith('data:image/') || safeUrl(b.src));
      if (!src) return P ? wrap(`<figure>${ph('사진', '사진을 올리면 여기에 보여요')}${capHTML(b)}</figure>`) : '';
      return wrap(`<figure><img src="${esc(b.src)}" alt="${esc(b.alt)}" loading="lazy">${capHTML(b)}</figure>`);
    }
    case 'gallery': {
      const items = (b.items || []).filter(x => x.src);
      if (!items.length) return P ? wrap(`<figure>${ph('사진 묶음', '사진을 2~4장 올리세요')}${capHTML(b)}</figure>`) : '';
      return wrap(`<figure><div class="gal gal-${Math.min(items.length, 4)}">${items.map(x => `<img src="${esc(x.src)}" alt="${esc(x.alt)}" loading="lazy">`).join('')}</div>${capHTML(b)}</figure>`);
    }
    case 'youtube': {
      const p = parseYouTube(b.url);
      if (!p || !p.ok) return P ? wrap(`<figure>${ph('유튜브', p ? '주소를 인식하지 못했어요' : '유튜브 주소를 넣으면 여기에 영상이 나와요')}${capHTML(b)}</figure>`) : '';
      return wrap(`<figure><div class="frame frame--video${p.short ? ' is-short' : ''}">${iframeTag(p.embed, b.caption || 'YouTube 동영상', 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen')}</div>${capHTML(b)}</figure>`);
    }
    case 'stats': {
      const items = (b.items || []).filter(x => x.value || x.label);
      if (!items.length) return P ? wrap(ph('숫자 강조', '숫자를 입력하세요'), 'col') : '';
      return wrap(`<div class="stats">${items.map(x => {
        const v = String(x.value || '').trim(); const countable = /^[\d,]+(\.\d+)?$/.test(v);
        return `<div class="stat"><div class="stat__num"><span${countable ? ` data-count="${esc(v)}"` : ''}>${esc(v)}</span>${x.unit ? `<small>${esc(x.unit)}</small>` : ''}</div>${x.label ? `<div class="stat__label">${esc(x.label)}</div>` : ''}</div>`;
      }).join('')}</div>${b.note ? `<p class="stats__note">${esc(b.note)}</p>` : ''}`, 'col');
    }
    case 'flourish': {
      const p = parseFlourish(b.url);
      if (!p || !p.ok) return P ? wrap(`<figure>${b.title ? `<p class="fig-title">${esc(b.title)}</p>` : ''}${ph('Flourish 시각화', p ? '주소를 인식하지 못했어요' : 'Flourish에서 게시한 주소를 넣으면 여기에 차트가 나와요')}${capHTML(b)}</figure>`) : '';
      return wrap(`<figure>${b.title ? `<p class="fig-title">${esc(b.title)}</p>` : ''}<div class="frame" style="--h:${+b.height || 600}px;--mh:${+b.mheight || +b.height || 520}px">${iframeTag(p.embed, b.title || 'Flourish 시각화', 'scrolling="no" sandbox="allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"')}</div>${capHTML(b)}</figure>`);
    }
    case 'sheet': {
      const title = b.title ? `<p class="fig-title">${esc(b.title)}</p>` : '';
      if (b.mode === 'embed') {
        const p = parseSheet(b.url);
        if (!p || !p.ok) return P ? wrap(`<figure>${title}${ph('구글 시트', '시트 주소를 넣으세요')}${capHTML(b)}</figure>`) : '';
        return wrap(`<figure>${title}<div class="frame" style="--h:${+b.height || 480}px">${iframeTag(p.embed, b.title || '구글 시트 표')}</div>${capHTML(b)}</figure>`);
      }
      const rows = parseTable(b.data).filter(r => r.some(c => String(c).trim()));
      if (rows.length < 1) return P ? wrap(`<figure>${title}${ph('구글 시트 표', '[시트에서 데이터 가져오기]를 누르거나 표를 붙여넣으세요')}${capHTML(b)}</figure>`) : '';
      const [head, ...body] = rows; const n = Math.max(...rows.map(r => r.length));
      const numCol = [...Array(n)].map((_, j) => body.length && body.every(r => !String(r[j] ?? '').trim() || isNumCell(r[j])));
      const cell = (c, j, tag) => `<${tag}${numCol[j] ? ' class="num"' : ''}>${esc(String(c ?? '').trim())}</${tag}>`;
      return wrap(`<figure>${title}<div class="tbl-wrap"><table class="dt"><thead><tr>${[...Array(n)].map((_, j) => cell(head[j], j, 'th')).join('')}</tr></thead><tbody>${body.map(r => `<tr>${[...Array(n)].map((_, j) => cell(r[j], j, 'td')).join('')}</tr>`).join('')}</tbody></table></div>${capHTML(b)}</figure>`);
    }
    case 'earth': {
      const src = mapEmbed(b);
      if (!src) return P ? wrap(`<figure>${ph('구글 어스 · 지도', '구글 어스 링크나 좌표를 넣으세요')}${capHTML(b)}</figure>`) : '';
      const lat = parseFloat(b.lat), lng = parseFloat(b.lng);
      const link = safeUrl(b.earthUrl) || (isFinite(lat) && isFinite(lng) ? earthLink(lat, lng, parseInt(b.zoom) || 16) : '');
      return wrap(`<figure><div class="frame" style="--h:${+b.height || 480}px">${iframeTag(src, b.label || b.caption || '지도')}</div>${link ? `<a class="earth-link" href="${esc(link)}" target="_blank" rel="noopener">구글 어스에서 3D로 보기 ↗</a>` : ''}${capHTML(b)}</figure>`);
    }
    case 'embed': {
      const p = parseEmbed(b.code);
      if (!p || !p.ok) return P ? wrap(`<figure>${ph('기타 임베드', '임베드 코드를 넣으세요')}${capHTML(b)}</figure>`) : '';
      return wrap(`<figure><div class="frame" style="--h:${+b.height || 500}px;--mh:${+b.mheight || +b.height || 500}px">${iframeTag(p.src, b.caption || '임베드 콘텐츠', 'allowfullscreen')}</div>${capHTML(b)}</figure>`);
    }
    case 'scrolly': return renderScrolly(b, P);
  }
  return '';
}
function renderScrolly(b, P) {
  const steps = (b.steps || []);
  if (!steps.length) return '';
  let figure = '', layerIdx = [];
  if (b.mode === 'flourish') {
    const p = parseFlourish(b.story);
    if (p && p.ok) {
      const first = Math.max(0, (parseInt(steps[0] && steps[0].slide) || 1) - 1);
      figure = `<iframe data-story="${esc(p.embed)}" src="${esc(p.embed)}#slide-${first}" title="Flourish 스토리" sandbox="allow-same-origin allow-forms allow-scripts allow-popups" scrolling="no"></iframe>`;
    } else if (P) figure = `<div class="scrolly__layer is-active">${ph('Flourish 스토리', 'Flourish 스토리 주소를 넣으세요')}</div>`;
    else return '';
  } else {
    const layers = []; let cur = -1;
    steps.forEach(s => { const ok = s.image && (s.image.startsWith('data:image/') || safeUrl(s.image)); if (ok) { layers.push(s.image); cur = layers.length - 1; } layerIdx.push(Math.max(cur, 0)); });
    if (!layers.length) {
      if (!P) layerIdx = [];
      figure = P ? `<div class="scrolly__layer is-active">${ph('스크롤리텔링 배경', '단계마다 그림을 올리면 카드가 지나갈 때 바뀝니다')}</div>` : '';
    } else figure = layers.map((src, i) => `<div class="scrolly__layer${i === 0 ? ' is-active' : ''}"><img src="${esc(src)}" alt="" ${i > 1 ? 'loading="lazy"' : ''}></div>`).join('');
  }
  const stepsHTML = steps.map((s, i) => {
    const slide = b.mode === 'flourish' ? ` data-slide="${Math.max(0, (parseInt(s.slide) || (i + 1)) - 1)}"` : '';
    const layer = layerIdx.length ? ` data-layer="${layerIdx[i]}"` : '';
    return `<div class="step${i === 0 ? ' is-active' : ''}"${slide}${layer}><div class="step__card">${md(s.text) || (P ? '<p style="opacity:.6">글 카드 내용을 입력하세요</p>' : '')}</div></div>`;
  }).join('');
  return `<div class="blk blk--scrolly" id="b-${esc(b.id)}"><section class="scrolly al-${esc(b.align || 'left')}" style="--fit:${b.fit === 'contain' ? 'contain' : 'cover'}"><div class="scrolly__fig">${figure}${b.credit ? `<span class="scrolly__credit">${esc(b.credit)}</span>` : ''}</div><div class="scrolly__steps">${stepsHTML}</div></section></div>`;
}

function renderHero(m, P) {
  const img = m.heroImage && (m.heroImage.startsWith('data:image/') || safeUrl(m.heroImage)) ? m.heroImage : '';
  const style = m.heroStyle || 'overlay';
  const kicker = m.kicker ? `<p class="hero__kicker">${esc(m.kicker)}</p>` : '';
  const title = `<h1 class="hero__title">${esc(m.title || (P ? '기사 제목을 입력하세요' : '')).replace(/\n/g, '<br>')}</h1>`;
  const sub = m.subtitle ? `<p class="hero__sub">${mdInline(m.subtitle).replace(/\n/g, '<br>')}</p>` : '';
  const credit = img && m.heroCredit ? `<span class="hero__credit">${esc(m.heroCredit)}</span>` : '';
  const imgTag = img ? `<img class="hero__img" src="${esc(img)}" alt="">` : '';
  if (style === 'split') return `<header class="hero hero--split" id="b-meta"><div class="hero__in">${kicker}${title}${sub}</div><div class="hero__media">${imgTag || (P ? ph('표지 사진', '표지 사진을 올리세요') : '')}${credit}</div></header>`;
  if (style === 'text') return `<header class="hero hero--text" id="b-meta"><div class="hero__in">${kicker}${title}${sub}</div>${img ? `<div class="hero__media"><img src="${esc(img)}" alt="">${credit}</div>` : ''}</header>`;
  return `<header class="hero hero--overlay${img ? '' : ' no-img'}" id="b-meta">${imgTag}<div class="hero__in">${kicker}${title}${sub}</div>${credit}</header>`;
}
function renderByline(m) {
  const as = parseAuthors(m.authors);
  if (!as.length && !m.team && !m.date) return '';
  return `<div class="byline">${m.team ? `<span class="team">${esc(m.team)}</span>` : ''}${as.map(a => `<span class="by">${esc(a.name)} 기자${a.email ? `<a href="mailto:${esc(a.email)}">${esc(a.email)}</a>` : ''}</span>`).join('')}${m.date ? `<time datetime="${esc(m.date)}">${fmtDate(m.date)}</time>` : ''}</div>`;
}
function renderEnd(m) {
  const credits = String(m.credits || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const i = l.search(/[:：]/); return i > 0 ? [l.slice(0, i).trim(), l.slice(i + 1).trim()] : ['', l]; });
  const srcs = String(m.sources || '').split('\n').map(l => l.trim()).filter(Boolean);
  if (!credits.length && !srcs.length && !m.endnote && !m.outlet) return '';
  return `<footer class="credits" id="b-end">
${m.endnote ? `<p class="endnote">${mdInline(m.endnote).replace(/\n/g, '<br>')}</p>` : ''}
${credits.length ? `<h2>만든 사람들</h2><dl>${credits.map(([r, n]) => `<dt>${esc(r)}</dt><dd>${esc(n)}</dd>`).join('')}</dl>` : ''}
${srcs.length ? `<h2>자료 출처</h2><ul>${srcs.map(s => `<li>${linkify(s)}</li>`).join('')}</ul>` : ''}
${m.outlet ? `<p class="outlet">© ${new Date().getFullYear()} ${esc(m.outlet)}</p>` : ''}
</footer>`;
}

/* 발행된 기사 안에서 도는 코드 (진행 막대, 스크롤리텔링, 숫자 카운트업, 링크 복사) */
function articleRuntime() {
  var bar = document.querySelector('.progress span');
  function onScroll() { var d = document.documentElement, p = d.scrollTop / Math.max(1, d.scrollHeight - d.clientHeight); if (bar) bar.style.transform = 'scaleX(' + Math.min(1, Math.max(0, p)) + ')'; }
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  var hasIO = 'IntersectionObserver' in window;
  document.querySelectorAll('.scrolly').forEach(function (sec) {
    var layers = sec.querySelectorAll('.scrolly__layer'), frame = sec.querySelector('iframe[data-story]'), steps = sec.querySelectorAll('.step');
    if (!hasIO) return;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        var s = e.target;
        steps.forEach(function (x) { x.classList.toggle('is-active', x === s); });
        if (s.dataset.layer != null && layers.length) layers.forEach(function (l, j) { l.classList.toggle('is-active', j === +s.dataset.layer); });
        if (frame && s.dataset.slide != null) { var u = frame.dataset.story + '#slide-' + s.dataset.slide; if (frame.src !== u) frame.src = u; }
      });
    }, { rootMargin: '-45% 0px -45% 0px' });
    steps.forEach(function (s) { io.observe(s); });
  });
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (hasIO && !reduce) {
    var io2 = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return; io2.unobserve(e.target);
        var el = e.target, raw = el.dataset.count, target = parseFloat(raw.replace(/,/g, '')), dec = (raw.split('.')[1] || '').length, comma = raw.indexOf(',') > -1;
        if (isNaN(target)) return;
        var t0 = performance.now(), dur = 1400;
        function fmt(v) { var s = v.toFixed(dec); if (!comma) return s; var p = s.split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return p.join('.'); }
        (function tick(now) { var k = Math.min(1, (now - t0) / dur), ease = 1 - Math.pow(1 - k, 3); el.textContent = fmt(target * ease); if (k < 1) requestAnimationFrame(tick); else el.textContent = raw; })(t0);
      });
    }, { threshold: 0.6 });
    document.querySelectorAll('[data-count]').forEach(function (el) { io2.observe(el); });
  }
  var top = document.querySelector('.topbar'), hero = document.querySelector('.hero--overlay');
  if (top && hero) top.classList.add('on-dark');
  var share = document.querySelector('.share');
  if (share) share.addEventListener('click', function () {
    var done = function () { share.textContent = '링크 복사됨'; setTimeout(function () { share.textContent = '링크 복사'; }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, function () { window.prompt('이 주소를 복사하세요', location.href); });
    else window.prompt('이 주소를 복사하세요', location.href);
  });
}
/* 미리보기 전용: 블록 클릭 → 편집 창 이동, 스크롤 위치 기억 */
function previewRuntime() {
  document.addEventListener('click', function (e) {
    if (e.target.closest('a,button,iframe,summary,.share')) return;
    var b = e.target.closest('[id^="b-"]'); if (b) parent.postMessage({ sk: 'pick', id: b.id.slice(2) }, '*');
  });
  addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.sk === 'goto') { var el = document.getElementById('b-' + d.id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    if (d.sk === 'restore') scrollTo(0, d.y);
  });
  var t; addEventListener('scroll', function () { clearTimeout(t); t = setTimeout(function () { parent.postMessage({ sk: 'scroll', y: scrollY }, '*'); }, 150); }, { passive: true });
  parent.postMessage({ sk: 'ready' }, '*');
}

function buildArticle(s, P) {
  const m = s.meta;
  const title = (m.title || '제목 없음').replace(/\s+/g, ' ');
  const desc = (m.subtitle || '').replace(/\s+/g, ' ').slice(0, 160);
  const og = safeUrl(m.shareImage) || (safeUrl(m.heroImage) || '');
  const body = s.blocks.map(b => renderBlock(b, P)).filter(Boolean).join('\n');
  return `<!doctype html>
<html lang="ko" data-theme="${isDarkBg(validHex(m.bg, '#ffffff')) ? 'dark' : 'light'}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>${esc(title)}</title>
<meta name="description" content="${esc(desc)}">
<meta property="og:type" content="article">
<meta property="og:title" content="${esc(title)}">
<meta property="og:description" content="${esc(desc)}">
${og ? `<meta property="og:image" content="${esc(og)}">\n<meta name="twitter:card" content="summary_large_image">` : ''}
<meta name="generator" content="Story Kit ${VERSION}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="${fontLink(m)}">
<style>${articleCSS(m)}</style>
</head>
<body>
<div class="progress" aria-hidden="true"><span></span></div>
<div class="topbar"><span>${esc(m.outlet || '')}</span><button class="share" type="button">링크 복사</button></div>
${renderHero(m, P)}
${renderByline(m)}
<main>
${body}
</main>
${renderEnd(m)}
<script>(${articleRuntime.toString()})();${P ? `(${previewRuntime.toString()})();` : ''}<\/script>
</body>
</html>`;
}

/* =====================================================================
   6. 미리보기 연결
   ===================================================================== */
let pvTimer = null, pvScroll = 0;
const pv = $('#pv');
function refreshPreview() { pv.srcdoc = buildArticle(state, true); }
function schedulePreview(now) {
  clearTimeout(pvTimer);
  if (!$('#pvAuto').checked && !now) return;
  pvTimer = setTimeout(refreshPreview, now ? 0 : 650);
}
addEventListener('message', e => {
  if (e.source !== pv.contentWindow) return;
  const d = e.data || {};
  if (d.sk === 'scroll') pvScroll = d.y;
  if (d.sk === 'ready') pv.contentWindow.postMessage({ sk: 'restore', y: pvScroll }, '*');
  if (d.sk === 'pick') pickCard(d.id);
});
pv.addEventListener('load', () => { try { pv.contentWindow.postMessage({ sk: 'restore', y: pvScroll }, '*'); } catch (e) { } });
let lastGoto = null;
function gotoPreview(id) {
  if (id === lastGoto) return; lastGoto = id;
  const target = id === 'style' ? 'meta' : id;
  try { pv.contentWindow.postMessage({ sk: 'goto', id: target }, '*'); } catch (e) { }
}
function pickCard(id) {
  pickedId = id; lastGoto = id; openCards.add(id);
  document.querySelectorAll('.card').forEach(c => {
    const on = c.dataset.id === id; c.classList.toggle('is-picked', on);
    if (on) { c.classList.add('is-open'); c.querySelector('.card__toggle').setAttribute('aria-expanded', 'true'); }
  });
  const c = document.querySelector(`.card[data-id="${id}"]`);
  if (innerWidth <= 960) setView('edit');
  if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function changed(structural) {
  if (structural) renderEditor();
  scheduleSave(); schedulePreview(false);
}

function modal(title, nodes) {
  const box = h('div', { class: 'modal__box', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, h('h2', {}, title), ...nodes,

function checkArticle() {
  const issues = [], m = state.meta;
  if (!m.title) issues.push('기사 제목이 비어 있어요.');
  if (!parseAuthors(m.authors).length) issues.push('기자 이름이 없어요.');
  if ((m.headFont === 'custom' || m.bodyFont === 'custom') && !m.fontData) issues.push('[내가 올린 글꼴]을 골랐지만 글꼴 파일이 없어 나눔고딕으로 보여요.');
  state.blocks.forEach((b, i) => {
    const n = `${i + 1}번째 블록(${TYPES[b.type].name})`;
    if (b.type === 'image' && b.src && !b.alt) issues.push(`${n}: 대체 텍스트가 비어 있어요.`);
    if (['youtube', 'flourish'].includes(b.type) && !(PARSERS[b.type](b.url) || {}).ok) issues.push(`${n}: 주소가 없거나 인식되지 않아 발행본에서 빠져요.`);
    if (b.type === 'earth' && !mapEmbed(b)) issues.push(`${n}: 위치가 없어 발행본에서 빠져요.`);
    if (b.type === 'sheet' && b.mode !== 'embed' && !String(b.data || '').trim()) issues.push(`${n}: 표 데이터가 비어 있어 발행본에서 빠져요.`);
    if (b.type === 'flourish' && (parseFlourish(b.url) || {}).ok && !b.source) issues.push(`${n}: 데이터 출처를 적어 주세요.`);

  return issues;
}
